<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">BHANDS Digital Universe HUD Hero</title>
  <desc id="desc">Dark sci-fi neon cyan-blue nebula HUD banner for BHANDS creative developer profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02050A"/>
      <stop offset="0.48" stop-color="#07131F"/>
      <stop offset="1" stop-color="#010308"/>
    </linearGradient>
    <radialGradient id="nebula" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#00E5FF" stop-opacity=".30"/>
      <stop offset=".23" stop-color="#007BFF" stop-opacity=".20"/>
      <stop offset=".55" stop-color="#003E78" stop-opacity=".10"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="34%" cy="26%" r="78%">
      <stop offset="0" stop-color="#1B4968"/>
      <stop offset=".38" stop-color="#092030"/>
      <stop offset="1" stop-color="#010509"/>
    </radialGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF"/>
      <stop offset=".5" stop-color="#4AC7FF"/>
      <stop offset="1" stop-color="#00FFF0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00C8FF" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
    <clipPath id="roundClip"><rect x="10" y="10" width="1580" height="600" rx="20"/></clipPath>
  </defs>

  <rect width="1600" height="620" fill="url(#bg)"/>
  <rect width="1600" height="620" fill="url(#grid)"/>
  <rect width="1600" height="620" fill="url(#nebula)"/>

  <!-- soft nebula core -->
  <ellipse cx="800" cy="275" rx="530" ry="190" fill="#008BFF" opacity=".11" filter="url(#softGlow)"/>
  <ellipse cx="800" cy="275" rx="350" ry="105" fill="#00E5FF" opacity=".10" filter="url(#softGlow)"/>

  <!-- stars / particles -->
  <g fill="#7CEFFF">
    <circle cx="86" cy="156" r="1.4" opacity=".5"/><circle cx="140" cy="91" r=".9" opacity=".7"/>
    <circle cx="205" cy="169" r="1.8" opacity=".55"/><circle cx="263" cy="73" r="1" opacity=".45"/>
    <circle cx="321" cy="144" r="1.2" opacity=".65"/><circle cx="382" cy="51" r="1" opacity=".35"/>
    <circle cx="438" cy="109" r="1.5" opacity=".7"/><circle cx="494" cy="70" r="1" opacity=".42"/>
    <circle cx="543" cy="170" r="1.1" opacity=".5"/><circle cx="608" cy="96" r="1.4" opacity=".55"/>
    <circle cx="675" cy="44" r="1.2" opacity=".7"/><circle cx="742" cy="122" r="1.3" opacity=".55"/>
    <circle cx="840" cy="68" r="1" opacity=".45"/><circle cx="905" cy="142" r="1.4" opacity=".75"/>
    <circle cx="980" cy="75" r="1" opacity=".6"/><circle cx="1058" cy="145" r="1.6" opacity=".5"/>
    <circle cx="1140" cy="70" r="1.1" opacity=".65"/><circle cx="1204" cy="155" r="1.6" opacity=".7"/>
    <circle cx="1270" cy="91" r="1" opacity=".45"/><circle cx="1332" cy="180" r="1.5" opacity=".6"/>
    <circle cx="1410" cy="66" r="1" opacity=".7"/><circle cx="1490" cy="160" r="1.7" opacity=".5"/>

    <circle cx="56" cy="386" r="1.2" opacity=".6"/><circle cx="216" cy="445" r="1.2" opacity=".5"/>
    <circle cx="322" cy="389" r="1.7" opacity=".65"/><circle cx="420" cy="470" r="1" opacity=".35"/>
    <circle cx="544" cy="423" r="1.1" opacity=".55"/><circle cx="676" cy="468" r="1.6" opacity=".7"/>
    <circle cx="948" cy="450" r="1.2" opacity=".55"/><circle cx="1048" cy="417" r="1.6" opacity=".65"/>
    <circle cx="1165" cy="482" r="1" opacity=".45"/><circle cx="1290" cy="410" r="1.4" opacity=".55"/>
    <circle cx="1402" cy="430" r="1.2" opacity=".7"/><circle cx="1510" cy="384" r="1.7" opacity=".5"/>
  </g>

  <!-- bright stars -->
  <g fill="#D9FEFF" filter="url(#glow)">
    <circle cx="397" cy="108" r="2.3"/><circle cx="727" cy="124" r="2.1"/>
    <circle cx="960" cy="146" r="2.5"/><circle cx="1189" cy="195" r="2.2"/>
    <circle cx="1320" cy="95" r="2.6"/><circle cx="533" cy="336" r="2.1"/>
    <circle cx="1108" cy="353" r="2.4"/><circle cx="1440" cy="305" r="2.0"/>
  </g>

  <!-- nebula energy -->
  <g fill="none" stroke="url(#cyan)" stroke-linecap="round" filter="url(#glow)">
    <path d="M150 293 C340 90 580 470 815 250 C1040 40 1260 415 1470 240" stroke-width="3" opacity=".38"/>
    <path d="M165 318 C370 145 560 425 805 275 C1030 120 1250 355 1450 270" stroke-width="2" opacity=".30"/>
    <path d="M210 240 C390 80 610 470 840 230 C1040 70 1215 370 1405 210" stroke-width="1.4" opacity=".24"/>
    <path d="M185 350 C420 150 620 420 790 300 C1000 130 1190 405 1430 290" stroke-width="1.6" opacity=".20"/>
  </g>

  <!-- orbits -->
  <g fill="none">
    <ellipse cx="800" cy="270" rx="535" ry="145" stroke="#00E5FF" stroke-opacity=".38" stroke-width="1.6"/>
    <ellipse cx="800" cy="270" rx="455" ry="118" stroke="#00BFFF" stroke-opacity=".20" stroke-width="1"/>
    <ellipse cx="800" cy="270" rx="330" ry="82" stroke="#00FFF0" stroke-opacity=".14" stroke-width="1"/>
  </g>

  <!-- central planet -->
  <circle cx="800" cy="252" r="174" fill="url(#planet)" opacity=".93"/>
  <circle cx="800" cy="252" r="174" fill="none" stroke="#008BFF" stroke-opacity=".18" stroke-width="3"/>
  <ellipse cx="800" cy="252" rx="188" ry="58" transform="rotate(-8 800 252)" fill="none" stroke="#00E5FF" stroke-opacity=".55" stroke-width="2"/>
  <ellipse cx="800" cy="252" rx="207" ry="74" transform="rotate(-8 800 252)" fill="none" stroke="#00AFFF" stroke-opacity=".16" stroke-width="1"/>

  <!-- planets -->
  <circle cx="142" cy="466" r="72" fill="url(#planet)" stroke="#008BFF" stroke-opacity=".28"/>
  <ellipse cx="142" cy="466" rx="94" ry="26" fill="none" stroke="#00E5FF" stroke-opacity=".20" stroke-width="1.2" transform="rotate(-12 142 466)"/>
  <circle cx="1385" cy="120" r="50" fill="url(#planet)" stroke="#008BFF" stroke-opacity=".30"/>
  <ellipse cx="1385" cy="120" rx="66" ry="16" fill="none" stroke="#00E5FF" stroke-opacity=".18" transform="rotate(12 1385 120)"/>

  <!-- left HUD ring -->
  <g transform="translate(118 265)" fill="none" stroke="#00E5FF">
    <circle r="78" stroke-opacity=".28" stroke-width="1.5"/>
    <circle r="62" stroke-opacity=".70" stroke-width="1"/>
    <circle r="52" stroke-opacity=".16" stroke-width="6"/>
    <circle r="7" fill="#00E5FF" stroke="none" filter="url(#glow)"/>
    <path d="M0-74 A74 74 0 0 1 58-46" stroke-width="4" stroke-dasharray="8 7"/>
    <path d="M-58 46 A74 74 0 0 0 -27 68" stroke-width="2" stroke-dasharray="3 6"/>
  </g>
  <text x="118" y="281" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#9FEFFF">B</text>

  <!-- corner HUDs -->
  <g fill="none" stroke="#00E5FF" stroke-width="1.4">
    <path d="M26 94V26H96"/><path d="M26 52H46"/><path d="M50 26V46"/>
    <path d="M1574 94V26H1504"/><path d="M1574 52H1554"/><path d="M1550 26V46"/>
    <path d="M26 560V594H62"/><path d="M1574 560V594H1538"/>
  </g>

  <!-- corner text -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#00E5FF">
    <text x="52" y="52" font-size="17" font-weight="700" letter-spacing="4">DIGITAL UNIVERSE</text>
    <text x="52" y="76" font-size="11" letter-spacing="3">CODE × DESIGN</text>
    <text x="52" y="94" font-size="11" letter-spacing="3">CREATE × FUTURE</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#00E5FF" text-anchor="end">
    <text x="1548" y="52" font-size="12" letter-spacing="2">BETTER CODE</text>
    <text x="1548" y="72" font-size="12" letter-spacing="2">BETTER TOOLS</text>
    <text x="1548" y="92" font-size="12" letter-spacing="2">A BRIGHTER FUTURE</text>
  </g>

  <!-- main title -->
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="800" y="214" font-size="94" font-weight="900" letter-spacing="7" fill="#E0FCFF" filter="url(#glow)">BHANDS</text>
    <text x="800" y="259" font-size="22" font-weight="600" letter-spacing="9" fill="#00E5FF">CREATIVE DEVELOPER</text>
    <path d="M565 283H1035" stroke="url(#cyan)" stroke-width="2"/>
    <text x="800" y="320" font-size="18" letter-spacing="8" fill="#A8F3FF">UNREAL  /  C++  /  WEB  /  AI  /  3D</text>
  </g>

  <!-- data ticks -->
  <g fill="#00E5FF">
    <rect x="1070" y="289" width="7" height="7"/><rect x="1083" y="289" width="7" height="7" opacity=".65"/>
    <rect x="1096" y="289" width="7" height="7" opacity=".40"/><rect x="1109" y="289" width="7" height="7" opacity=".20"/>
  </g>

  <!-- bottom micro HUD -->
  <g font-family="Arial, Helvetica, sans-serif" fill="#00E5FF">
    <text x="58" y="580" font-size="11" letter-spacing="3">SYSTEM // ONLINE</text>
    <text x="1542" y="580" text-anchor="end" font-size="11" letter-spacing="3">KEEP EXPLORING //</text>
    <text x="800" y="580" text-anchor="middle" font-size="12" letter-spacing="5" fill="#80EDFF">BHANDS // DIGITAL UNIVERSE // 2026</text>
  </g>

  <!-- scan lines -->
  <g stroke="#00E5FF" opacity=".09">
    <path d="M24 360H1576"/>
    <path d="M24 366H1576"/>
    <path d="M24 372H1576"/>
  </g>

  <!-- outer frame -->
  <rect x="10" y="10" width="1580" height="600" rx="20" fill="none" stroke="#00BFFF" stroke-opacity=".55" stroke-width="1.5"/>
  <rect x="20" y="20" width="1560" height="580" rx="16" fill="none" stroke="#00E5FF" stroke-opacity=".08"/>

  <!-- edge accents -->
  <g fill="#00E5FF">
    <rect x="26" y="116" width="44" height="2"/>
    <rect x="26" y="121" width="22" height="2" opacity=".45"/>
    <rect x="1530" y="116" width="44" height="2"/>
    <rect x="1552" y="121" width="22" height="2" opacity=".45"/>
  </g>
</svg>
